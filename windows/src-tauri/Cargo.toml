[package]
name = "scorpena"
version = "3.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
tauri-plugin-clipboard-manager = "2"
