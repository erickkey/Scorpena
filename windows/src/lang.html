<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorpena – video downloader</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; height: 100vh; }
  body > img { width: 56px; height: 56px; }
  h1 { margin: 0; font-size: 17px; }
  .opts { display: flex; gap: 16px; }
  .opt { width: 140px; height: 100px; border-radius: 12px; border: 1px solid var(--separator); background: var(--card); color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: inherit; }
  .opt:hover { background: var(--soft); }
  .opt .flag { font-size: 38px; line-height: 1; } .opt .nm { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <img src="logo.png" alt="">
  <h1>Выбери язык / Choose your language</h1>
  <div class="opts">
    <button class="opt" data-l="ru"><span class="flag" data-flag="ru"></span><span class="nm">Русский</span></button>
    <button class="opt" data-l="en"><span class="flag" data-flag="en"></span><span class="nm">English</span></button>
  </div>
<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
  document.querySelectorAll('.flag').forEach(f => { f.innerHTML = FLAGS[f.dataset.flag]; const i = f.firstChild; i.setAttribute('width', 42); i.setAttribute('height', 28); i.style.borderRadius = '3px'; i.style.boxShadow = '0 0 0 1px rgba(128,128,128,.35)'; });
  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { setLanguage(b.dataset.l); cmd('langChosen'); setTimeout(closeMe, 150); }));
</script>
</body>
</html>
